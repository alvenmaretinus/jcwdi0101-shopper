services:
  postgres:
    image: postgres:16-alpine
    container_name: shopper-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopper}
      POSTGRES_USER: ${POSTGRES_USER:-shopper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopper}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopper} -d ${POSTGRES_DB:-shopper}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopper-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: ${BACKEND_NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-shopper}:${POSTGRES_PASSWORD:-shopper}@postgres:5432/${POSTGRES_DB:-shopper}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-this-secret}
      KOMERCE_API_URL: ${KOMERCE_API_URL:-https://api-sandbox.collaborator.komerce.id/tariff/api/v1}
      KOMERCE_API_KEY: ${KOMERCE_API_KEY:-}
      BANK_ACCOUNT_NUMBER: ${BANK_ACCOUNT_NUMBER:-1234567890}
      BANK_ACCOUNT_HOLDER: ${BANK_ACCOUNT_HOLDER:-PT. Shopper Indonesia}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_MERCHANT_ID: ${MIDTRANS_MERCHANT_ID:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOOGLE_CLIENT: ${GOOGLE_CLIENT:-}
      GOOGLE_APP_EMAIL: ${GOOGLE_APP_EMAIL:-}
      GOOGLE_APP_PASSWORD: ${GOOGLE_APP_PASSWORD:-}
    ports:
      - "3001:3001"
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
        NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${NEXT_PUBLIC_MIDTRANS_CLIENT_KEY:-}
    container_name: shopper-frontend
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
      NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${NEXT_PUBLIC_MIDTRANS_CLIENT_KEY:-}
      OPEN_CAGE_API_KEY: ${OPEN_CAGE_API_KEY:-}
      KOMERCE_API_KEY: ${KOMERCE_API_KEY:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-this-secret}
      UPLOADTHING_TOKEN: ${UPLOADTHING_TOKEN:-}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
