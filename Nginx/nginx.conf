resolver 127.0.0.11 valid=30s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    listen [::]:80;
    server_name goshopper.web.id www.goshopper.web.id;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://goshopper.web.id$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.goshopper.web.id;

    ssl_certificate /etc/letsencrypt/live/goshopper.web.id-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goshopper.web.id-0001/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://goshopper.web.id$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name goshopper.web.id;

    ssl_certificate /etc/letsencrypt/live/goshopper.web.id-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goshopper.web.id-0001/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    set $frontend_upstream frontend:3000;
    set $backend_upstream backend:3001;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location ^~ /api/uploadthing {
        proxy_pass http://$frontend_upstream;
    }

    location = /api/forward-geo-idn {
        proxy_pass http://$frontend_upstream;
    }

    location = /api/reverse-geo-idn {
        proxy_pass http://$frontend_upstream;
    }

    location ^~ /api/auth/ {
        proxy_pass http://$backend_upstream;
    }

    location ^~ /api/ {
        proxy_pass http://$backend_upstream;
    }

    location = /uploads {
        proxy_pass http://$backend_upstream;
    }

    location ^~ /uploads/ {
        proxy_pass http://$backend_upstream;
    }

    location / {
        proxy_pass http://$frontend_upstream;
    }
}
